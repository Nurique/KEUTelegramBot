services:
  admin:
    build: .
    image: keu-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot-data:/app/data
    # Порт и адрес на хосте задаются в .env (ADMIN_PORT, ADMIN_BIND).
    # По умолчанию только localhost: публикуйте через reverse proxy с HTTPS (Caddy, nginx).
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-3000}:3000"

  bot:
    image: keu-bot
    depends_on:
      - admin
    restart: unless-stopped
    env_file: .env
    command: ["node", "bot.cjs"]
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
